<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
    <defs>
      <radialGradient id="bg" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </radialGradient>
      <linearGradient id="fishBody" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d97706"/>
        <stop offset="40%" stop-color="#b45309"/>
        <stop offset="80%" stop-color="#78350f"/>
        <stop offset="100%" stop-color="#451a03"/>
      </linearGradient>
      <linearGradient id="roeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="50%" stop-color="#ef4444"/>
        <stop offset="100%" stop-color="#d97706"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="12" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    <rect width="600" height="450" fill="url(#bg)"/>
    <!-- Ambient roe glow -->
    <circle cx="320" cy="225" r="140" fill="#f59e0b" opacity="0.18" filter="url(#glow)"/>
    <!-- Fish Silhouette & Cut -->
    <g transform="translate(40, 40)">
      <!-- Tail fin -->
      <path d="M120 185 L50 130 C70 185 70 185 50 240 Z" fill="#92400e" opacity="0.9"/>
      <!-- Main body -->
      <path d="M110 185 C160 120 280 110 420 185 C280 260 160 250 110 185 Z" fill="url(#fishBody)"/>
      <!-- Dorsal fin -->
      <path d="M260 125 C300 90 350 100 360 140 Z" fill="#92400e" opacity="0.85"/>
      <!-- Roe Pocket cut open -->
      <ellipse cx="280" cy="188" rx="85" ry="32" fill="url(#roeGlow)" filter="url(#glow)"/>
      <!-- Caviar texture dots -->
      <g fill="#fef08a" opacity="0.8">
        <circle cx="240" cy="180" r="3.5"/><circle cx="255" cy="175" r="4"/><circle cx="270" cy="182" r="4.5"/>
        <circle cx="285" cy="178" r="4"/><circle cx="300" cy="185" r="4.5"/><circle cx="315" cy="180" r="3.8"/>
        <circle cx="250" cy="192" r="4"/><circle cx="265" cy="198" r="4.2"/><circle cx="280" cy="195" r="4.8"/>
        <circle cx="295" cy="196" r="4"/><circle cx="310" cy="192" r="3.6"/><circle cx="325" cy="188" r="3.5"/>
      </g>
      <!-- Head and Eye -->
      <circle cx="400" cy="178" r="6" fill="#fef3c7"/>
      <circle cx="401" cy="178" r="3" fill="#0f172a"/>
      <!-- Glistening highlights -->
      <path d="M190 145 C250 130 330 140 370 165" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    </g>
    <rect x="24" y="24" width="130" height="28" rx="14" fill="#d97706" opacity="0.95"/>
    <text x="89" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">100% С ИКРОЙ</text>
  </svg>