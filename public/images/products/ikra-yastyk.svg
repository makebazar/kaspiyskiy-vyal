<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
    <defs>
      <radialGradient id="bg7" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </radialGradient>
      <linearGradient id="yastykGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="40%" stop-color="#f59e0b"/>
        <stop offset="70%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#9a3412"/>
      </linearGradient>
      <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="16" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    <rect width="600" height="450" fill="url(#bg7)"/>
    <circle cx="300" cy="225" r="130" fill="#f59e0b" opacity="0.22" filter="url(#glow2)"/>
    <g transform="translate(100, 70)">
      <!-- Amber roe skeins (yastyki) -->
      <path d="M60 170 C90 100 240 100 320 150 C260 210 120 220 60 170 Z" fill="url(#yastykGrad)" filter="url(#glow2)"/>
      <path d="M100 190 C140 130 280 130 350 180 C290 240 160 250 100 190 Z" fill="url(#yastykGrad)" opacity="0.95"/>
      <!-- Caviar texture -->
      <g fill="#fef3c7" opacity="0.9">
        <circle cx="160" cy="160" r="3.8"/><circle cx="180" cy="155" r="4"/><circle cx="200" cy="162" r="4.2"/>
        <circle cx="220" cy="158" r="3.9"/><circle cx="240" cy="165" r="4.1"/><circle cx="260" cy="160" r="3.7"/>
        <circle cx="170" cy="180" r="4"/><circle cx="190" cy="185" r="4.3"/><circle cx="210" cy="178" r="4.5"/>
        <circle cx="230" cy="186" r="4.1"/><circle cx="250" cy="180" r="3.8"/><circle cx="270" cy="176" r="3.6"/>
      </g>
    </g>
    <rect x="24" y="24" width="110" height="28" rx="14" fill="#b45309" opacity="0.95"/>
    <text x="79" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">ДЕЛИКАТЕС</text>
  </svg>