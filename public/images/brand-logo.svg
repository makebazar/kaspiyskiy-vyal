<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" fill="none">
  <!-- Circular Emblem -->
  <g transform="translate(100, 10)">
    <!-- Outer circle with sun & waves -->
    <circle cx="100" cy="100" r="95" stroke="#eedfc8" stroke-width="3" fill="none"/>
    
    <!-- Bird in sky -->
    <path d="M140,55 C146,50 152,50 157,56 C162,50 168,50 174,55 C166,57 160,61 157,63 C154,61 148,57 140,55 Z" fill="#eedfc8"/>
    
    <!-- Winding Volga River through delta -->
    <path d="M100,60 C90,85 125,100 85,125 C65,138 75,148 100,150" stroke="#eedfc8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M110,60 C100,85 135,100 95,125 C75,138 85,148 110,150" stroke="#eedfc8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Stylized Waves -->
    <path d="M30,140 C55,130 75,150 100,140 C125,130 145,150 170,140" stroke="#eedfc8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M20,158 C50,146 75,168 100,158 C125,148 150,170 180,158" stroke="#eedfc8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M25,176 C55,164 75,186 100,176 C125,166 145,188 175,176" stroke="#eedfc8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Text: К А С П И Й С К И Й -->
  <text x="200" y="240" text-anchor="middle" fill="#eedfc8" font-family="'Times New Roman', 'Playfair Display', serif" font-size="16" font-weight="600" letter-spacing="9">К А С П И Й С К И Й</text>
  
  <!-- Text: В Я Л -->
  <text x="200" y="285" text-anchor="middle" fill="#eedfc8" font-family="'Times New Roman', 'Playfair Display', serif" font-size="44" font-weight="900" letter-spacing="14">В Я Л</text>
  
  <!-- Decorative fish underline -->
  <g transform="translate(130, 300)">
    <line x1="0" y1="5" x2="50" y2="5" stroke="#eedfc8" stroke-width="1.2"/>
    <!-- Small Fish Icon -->
    <path d="M60,5 C66,1 76,1 80,5 C76,9 66,9 60,5 Z" fill="#eedfc8"/>
    <polygon points="60,5 54,2 54,8" fill="#eedfc8"/>
    <line x1="90" y1="5" x2="140" y2="5" stroke="#eedfc8" stroke-width="1.2"/>
  </g>
</svg>
