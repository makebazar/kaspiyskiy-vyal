<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061220"/>
      <stop offset="50%" stop-color="#0c2038"/>
      <stop offset="100%" stop-color="#08172c"/>
    </linearGradient>
    
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#eedfc8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#eedfc8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eedfc8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#eedfc8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#eedfc8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="180" fill="url(#goldGlow)"/>

  <!-- Subtle Elegant Outer Frame -->
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="28" y="28" width="544" height="344" rx="12" fill="none" stroke="#eedfc8" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Centered Logo Composition -->
  <g transform="translate(300, 150)">
    <!-- Outer emblem circle -->
    <circle cx="0" cy="0" r="54" fill="#061324" stroke="#eedfc8" stroke-width="2.5" stroke-opacity="0.85"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#eedfc8" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.4"/>

    <!-- Bird in sky -->
    <path d="M-15,-26 C-11,-30 -7,-30 -3,-26 C1,-30 5,-30 9,-26 C3,-24 -1,-22 -3,-20 C-5,-22 -9,-24 -15,-26 Z" fill="#eedfc8" fill-opacity="0.9"/>

    <!-- Volga delta river lines -->
    <path d="M-2,-14 C-8,4 16,14 -12,28" stroke="#eedfc8" stroke-width="2.2" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>
    <path d="M4,-14 C-2,4 22,14 -6,28" stroke="#eedfc8" stroke-width="2.2" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>

    <!-- Volga Waves -->
    <path d="M-32,16 C-20,10 -10,22 0,16 C10,10 20,22 32,16" stroke="#eedfc8" stroke-width="2" stroke-linecap="round" fill="none" stroke-opacity="0.75"/>
    <path d="M-28,26 C-18,20 -8,30 2,24 C12,18 22,30 28,24" stroke="#eedfc8" stroke-width="1.8" stroke-linecap="round" fill="none" stroke-opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="300" y="246" text-anchor="middle" fill="#eedfc8" fill-opacity="0.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, serif" font-size="11" font-weight="700" letter-spacing="6">КАСПИЙСКИЙ</text>
  <text x="300" y="278" text-anchor="middle" fill="#eedfc8" font-family="'Times New Roman', 'Playfair Display', Georgia, serif" font-size="28" font-weight="900" letter-spacing="10">ВЯЛ</text>

  <!-- Divider & Subtitle -->
  <line x1="220" y1="294" x2="380" y2="294" stroke="#eedfc8" stroke-opacity="0.25" stroke-width="1"/>
  
  <text x="300" y="318" text-anchor="middle" fill="#eedfc8" fill-opacity="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" letter-spacing="2.5">ОТБОРНЫЕ РЫБНЫЕ ДЕЛИКАТЕСЫ</text>
</svg>
